<mat-toolbar class="app-toolbar">
  <a class="brand" [routerLink]="auth.isAuthenticated() ? (auth.isAdmin() ? '/admin' : '/dashboard') : '/login'">
    <img [src]="logoSrc()" alt="QUADRA" class="brand-logo" />
    <span class="brand-name">QUADRA</span>
  </a>

  <span class="spacer"></span>

  @if (auth.isAuthenticated()) {
    @if (auth.isAdmin()) {
      <a mat-button routerLink="/admin" routerLinkActive="active-link">Panel admin</a>
      <a mat-button routerLink="/admin/red" routerLinkActive="active-link">Red y ciclos</a>
    } @else {
      <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Mi empresa</a>
      <a mat-button routerLink="/obligations" routerLinkActive="active-link">Obligaciones</a>
    }
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Cuenta">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-menu-header">
        {{ auth.currentUser()?.email }}
        @if (auth.currentUser()?.company_name) {
          <small>{{ auth.currentUser()?.company_name }}</small>
        }
      </div>
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  }

  <button mat-icon-button (click)="theme.toggle()" [attr.aria-label]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<router-outlet />
